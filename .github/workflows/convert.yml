name: Docs to PDF
on: [push]
jobs:
  converttopdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: README.md # Nome do seu arquivo
          output_dir: pdfs
      - uses: actions/upload-artifact@v3
        with:
          name: converted-pdfs
          path: pdfs